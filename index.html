<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emergency-Service</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon" />

    <link rel="stylesheet" href="./style.css" />

    <!-- Tailwind & Daisy UI CDN -->

    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font-awesome CDN  -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- HEADER SECTION -->

    <header class="px-[4%] flex justify-between items-center mt-4">
      <div class="flex justify-center items-center gap-2">
        <img class="w-6" src="./assets/logo.png" alt="" />
        <p class="text-sm font-bold text-[#006747] leading-4">
          Emergency <br />
          Service
        </p>
      </div>
      <div class="flex justify-center items-center gap-3">
        <div class="px-2 py-1 bg-[#41FF6B1A] rounded-2xl">
          <span>0</span>
          <i class="fa-solid text-red-600 fa-heart"></i>
        </div>
        <div
          class="flex justify-center items-center gap-1 px-2 py-1 bg-[#41FF6B1A] rounded-2xl"
        >
          <span>100</span>
          <img class="w-5" src="./assets/coin.png" alt="" />
        </div>
        <div class="px-2 py-1 bg-[#00A63E] rounded-2xl text-white">
          <p><span>0</span> copy</p>
        </div>
      </div>
    </header>

    <!-- MAIN SECTION -->

    <main>
      <!-- HERO SECTION -->

      <section
        class="bg-gradient-to-r from-[#013223] via-[#006747] to-[#013223] w-full mt-4 flex flex-col items-center justify-center gap-4 text-center text-white p-6"
      >
        <img class="w-20" src="./assets/logo-dark.png" alt="" />
        <h1 class="font-bold text-2xl">Emergency Service Directory</h1>
        <p class="text-sm">
          Government Emergency Services at Your Fingertip – A Project by
          Government of the People’s Republic of Bangladesh
          </p>
      </section>
    </main>

    <!-- FOOTER SECTION -->

    <footer></footer>

    <script src="./script.js"></script>
  </body>
</html>
