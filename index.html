<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emergency-Service</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon" />

    <link rel="stylesheet" href="./style.css" />

    <!-- Tailwind & Daisy UI CDN -->

    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font-awesome CDN  -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"

      referrerpolicy="no-referrer"
    />

  <body class="px-[4%]">
    <!-- HEADER SECTION -->

    <header class="flex justify-between items-center mt-4">
      <div class="flex justify-center items-center gap-2">
        <img class="w-10" src="./assets/logo.png" alt="" />
        <p>
          Emergency <br />
          Service
        </p>
      </div>
      <div class="flex justify-center items-center gap-3">
        <div>
          <span>0</span>
          <i class="fa-solid text-red-600 fa-heart"></i>
        </div>
        <div>
          <span>100</span>
          <img class="inline-block w-5" src="./assets/coin.png" alt="">
        </div>
        <div>
          <p><span>0</span> copy</p>
        </div>
      </div>
    </header>

    <!-- MAIN SECTION -->

    <main></main>

    <!-- FOOTER SECTION -->

    <footer></footer>

    <script src="./script.js"></script>
  </body>
</html>
